name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-package:
    name: Publish npm package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish package
        run: npm publish --access public --provenance

      - name: Verify the public package artifact
        run: |
          set -euo pipefail

          package_name="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.name)")"
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          artifact_directory="$(mktemp -d)"
          trap 'rm -rf "${artifact_directory}"' EXIT

          for attempt in $(seq 1 30); do
            metadata="$(npm view "${package_name}@${package_version}" dist.tarball dist.integrity --json 2>/dev/null || true)"
            tarball="$(jq -r '."dist.tarball" // empty' <<<"${metadata}")"
            expected_integrity="$(jq -r '."dist.integrity" // empty' <<<"${metadata}")"

            if [ -n "${tarball}" ] && [ -n "${expected_integrity}" ] &&
               curl --fail --silent --show-error --location \
                 --output "${artifact_directory}/package.tgz" \
                 "${tarball}?release-verification=${GITHUB_RUN_ATTEMPT}-${attempt}"; then
              actual_integrity="sha512-$(openssl dgst -sha512 -binary "${artifact_directory}/package.tgz" | openssl base64 -A)"
              [ "${actual_integrity}" = "${expected_integrity}" ] || {
                echo "Published tarball integrity does not match npm metadata." >&2
                exit 1
              }
              echo "Verified ${package_name}@${package_version} from the public npm registry."
              exit 0
            fi

            sleep 5
          done

          echo "Published npm tarball did not become publicly readable." >&2
          exit 1
